name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aicw
          POSTGRES_PASSWORD: aicw_dev_password
          POSTGRES_DB: aicw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aicw -d aicw"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build shared-types
        run: npm run build -w @ai-consultant/shared-types

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: API tests
        working-directory: apps/api
        run: npm test

      - name: Build API
        run: npm run build -w @ai-consultant/api

      - name: Build web-client
        run: npm run build -w @ai-consultant/web-client

      - name: Build web-admin
        run: npm run build -w @ai-consultant/web-admin

      - name: Build public-site
        run: npm run build -w @ai-consultant/public-site

      - name: Build widget
        run: npm run build -w @ai-consultant/widget

      - name: E2E smoke
        env:
          DATABASE_URL: postgresql://aicw:aicw_dev_password@localhost:5432/aicw?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-minimum-32-characters-long
          NODE_ENV: development
        run: |
          cd apps/api
          npx prisma migrate deploy
          npm run build
          node dist/main.js &
          API_PID=$!
          sleep 8
          cd ../../e2e
          npm install
          npm test
          kill $API_PID

      - name: Install k6
        continue-on-error: true
        run: |
          curl -fsSL https://get.k6.io | sh || true
          sudo cp k6 /usr/local/bin 2>/dev/null || sudo apt-get install -y -qq k6 2>/dev/null || true

      - name: Load test smoke (background API)
        continue-on-error: true
        run: |
          cd apps/api
          npm run build
          node dist/main.js &
          API_PID=$!
          sleep 5
          k6 run -u 10 -d 30s ../../load-tests/api-health.k6.js
          kill $API_PID
