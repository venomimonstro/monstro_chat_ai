services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aicw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aicw
      POSTGRES_PASSWORD: aicw_dev_password
      POSTGRES_DB: aicw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicw -d aicw"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aicw-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: aicw-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aicw_minio
      MINIO_ROOT_PASSWORD: aicw_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: aicw-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 aicw_minio aicw_minio_secret;
      mc mb local/aicw-files --ignore-existing;
      exit 0;
      "

  migrate:
    image: monstro_chat_ai-api
    container_name: aicw-migrate
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://aicw:aicw_dev_password@postgres:5432/aicw?schema=public
    command: npx prisma migrate deploy --schema=prisma/schema.prisma
    working_dir: /app
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: monstro_chat_ai-api
    container_name: aicw-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://aicw:aicw_dev_password@postgres:5432/aicw?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: aicw_minio
      S3_SECRET_KEY: aicw_minio_secret
      S3_BUCKET: aicw-files
      API_PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SKIP_2FA_ENFORCEMENT: ${SKIP_2FA_ENFORCEMENT:-true}
      APP_VERSION: ${APP_VERSION:-0.34.0}
      SPRINT_NUMBER: ${SPRINT_NUMBER:-34}
      RELEASE_DEPLOY_TOKEN: ${RELEASE_DEPLOY_TOKEN:-}
      STABILITY_API_URL: ${STABILITY_API_URL:-http://127.0.0.1:3000/api}
      STABILITY_CLIENT_URL: ${STABILITY_CLIENT_URL:-http://host.docker.internal:5173}
      STABILITY_ADMIN_URL: ${STABILITY_ADMIN_URL:-http://host.docker.internal:5174}
      STABILITY_PUBLIC_URL: ${STABILITY_PUBLIC_URL:-http://host.docker.internal:4321}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  minio_data:
